name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Security Audit & Secret Leak Detection
  # ----------------------------------------------------------------------------
  security-audit:
    name: Security Gate (TruffleHog Secret Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Repository for Hardcoded Secrets
        uses: trufflesecurity/trufflehog-action@main
        with:
          extra_args: --only-verified

  # ----------------------------------------------------------------------------
  # Stage 2: CI - Multi-Stage Container Build & Push to Registry
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push OCI Images to GHCR
    needs: security-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Multi-Stage Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Stage 3: CD - Zero-Downtime Deployment to Production EC2
  # ----------------------------------------------------------------------------
  deploy-to-ec2:
    name: Deploy to Production EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Pre-built Images to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting Production Deployment..."

            # 1. Pull latest repository setup files
            if [ -d "docker-multi-tier-ecommerce" ]; then
              cd docker-multi-tier-ecommerce
            elif [ -d "Docker-E-commerce" ]; then
              cd Docker-E-commerce
            else
              git clone https://github.com/MarzanulHoque/docker-multi-tier-ecommerce.git
              cd docker-multi-tier-ecommerce
            fi
            git pull origin main

            # 2. Fetch database password from AWS SSM Parameter Store into RAM
            TOKEN=$(curl -s -S -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60" 2>/dev/null || true)
            if [ -n "$TOKEN" ]; then
              DETECTED_REGION=$(curl -s -H "X-aws-ec2-metadata-token-ttl-seconds: 60" -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region 2>/dev/null || true)
            fi
            AWS_REGION="${DETECTED_REGION:-us-east-1}"

            export POSTGRES_PASSWORD=$(aws ssm get-parameter \
              --name "/prod/ecommerce/db_password" \
              --with-decryption \
              --query "Parameter.Value" \
              --output text \
              --region "$AWS_REGION")

            # 3. Log in to GHCR and pull pre-built images (No building on EC2!)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans

            # 4. Clean up dangling unused images
            docker image prune -f

            echo "✅ Production Deployment Complete!"
