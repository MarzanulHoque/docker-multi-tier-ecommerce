name: CI/CD Production Deployment & Security Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-audit:
    name: Security Scan & Secret Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Repository for Hardcoded Secrets
        uses: trufflesecurity/trufflehog-action@main
        with:
          extra_args: --only-verified

  deploy:
    name: Deploy Application to EC2
    needs: security-audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Connecting to EC2 and pulling latest code..."
            
            if [ -d "docker-multi-tier-ecommerce" ]; then
              cd docker-multi-tier-ecommerce
            elif [ -d "Docker-E-commerce" ]; then
              cd Docker-E-commerce
            else
              git clone https://github.com/MarzanulHoque/docker-multi-tier-ecommerce.git
              cd docker-multi-tier-ecommerce
            fi
            
            git pull origin main

            chmod +x deploy-ec2.sh
            ./deploy-ec2.sh

            echo "✅ Deployment complete!"
