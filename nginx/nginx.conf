events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    upstream frontend_app {
        server frontend:80;
    }

    upstream backend_api {
        server backend:3000;
    }

    # 1. HTTP Server (Port 80): ACME Challenge & Auto HTTP-to-HTTPS Redirect
    server {
        listen 80;
        server_name ${DOMAIN_NAME:-_};

        # Let's Encrypt Certbot challenge directory
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS (Port 443)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. HTTPS Server (Port 443): SSL Termination & Reverse Proxy
    server {
        listen 443 ssl;
        server_name ${DOMAIN_NAME:-_};

        # SSL Certificates (Provided by Certbot or custom mount)
        ssl_certificate /etc/letsencrypt/live/${DOMAIN_NAME:-localhost}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME:-localhost}/privkey.pem;

        # Modern SSL Security Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Route API requests to Node.js backend
        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Route Health requests to Node.js backend healthcheck endpoint
        location /health {
            proxy_pass http://backend_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Route UI requests to Frontend service
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
