<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Store | Modern E-Commerce</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #4ade80;
      --danger: #f87171;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 3rem; min-height: 100vh; }
    
    /* Navigation Bar */
    nav { background: #1e293b; border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 1.4rem; font-weight: 800; color: var(--accent); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
    .nav-status { display: flex; align-items: center; gap: 1.5rem; font-size: 0.85rem; }
    .status-badge { display: flex; align-items: center; gap: 0.4rem; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); padding: 0.3rem 0.8rem; border-radius: 20px; color: var(--accent); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; }

    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }

    /* Hero Banner */
    .hero { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border: 1px solid var(--border); border-radius: 16px; padding: 2.5rem; margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; }
    .hero-text h2 { font-size: 2rem; margin-bottom: 0.5rem; color: #fff; }
    .hero-text p { color: var(--text-muted); max-width: 500px; }

    .layout-grid { display: grid; grid-template-columns: 280px 1fr; gap: 2rem; }
    @media (max-width: 900px) { .layout-grid { grid-template-columns: 1fr; } }

    /* Form Card */
    .card { background: var(--card-bg); border-radius: 12px; padding: 1.5rem; border: 1px solid var(--border); }
    .card h3 { font-size: 1.1rem; margin-bottom: 1rem; color: #e2e8f0; }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: var(--text-muted); }
    .form-control { width: 100%; padding: 0.6rem; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: #fff; font-size: 0.9rem; }
    .form-control:focus { outline: none; border-color: var(--accent); }

    .btn { background: var(--accent); color: #0f172a; border: none; padding: 0.6rem 1.2rem; font-weight: 700; border-radius: 8px; cursor: pointer; transition: background 0.2s; width: 100%; }
    .btn:hover { background: var(--accent-hover); }

    /* Product Grid & Cards */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; }
    .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
    
    .img-container { width: 100%; height: 180px; background: #0f172a; overflow: hidden; position: relative; }
    .product-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .product-card:hover .product-img { transform: scale(1.05); }

    .product-body { padding: 1.2rem; display: flex; flex-direction: column; flex-grow: 1; }
    .category-tag { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); font-weight: 700; margin-bottom: 0.4rem; }
    .product-title { font-size: 1rem; font-weight: 600; color: #fff; margin-bottom: 0.8rem; line-height: 1.3; }
    .product-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; pt: 0.8rem; border-top: 1px solid var(--border); }
    .price-tag { font-size: 1.3rem; font-weight: 800; color: #fff; }

    .btn-delete { background: rgba(248, 113, 113, 0.1); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.3); padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; }
    .btn-delete:hover { background: var(--danger); color: #fff; }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <a href="#" class="logo">🛍️ Apex Store</a>
    <div class="nav-status">
      <div class="status-badge"><span class="dot"></span> Nginx Proxy</div>
      <div class="status-badge"><span class="dot"></span> Docker Microservices</div>
    </div>
  </nav>

  <div class="container">
    <!-- Hero Banner -->
    <div class="hero">
      <div class="hero-text">
        <h2>Premium Tech & Lifestyle Store</h2>
        <p>Powered by Node.js, PostgreSQL & Nginx in a Production Docker Multi-Tier Infrastructure.</p>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="layout-grid">
      <!-- Left Sidebar: Add New Product Form -->
      <div>
        <div class="card">
          <h3>➕ Add New Item</h3>
          <form id="add-product-form" onsubmit="handleCreateProduct(event)">
            <div class="form-group">
              <label>Product Name</label>
              <input type="text" id="p-name" class="form-control" placeholder="e.g. Wireless Earbuds" required>
            </div>
            <div class="form-group">
              <label>Price ($)</label>
              <input type="number" step="0.01" id="p-price" class="form-control" placeholder="99.99" required>
            </div>
            <div class="form-group">
              <label>Category</label>
              <input type="text" id="p-category" class="form-control" placeholder="Electronics" required>
            </div>
            <div class="form-group">
              <label>Image URL (Optional)</label>
              <input type="url" id="p-image" class="form-control" placeholder="https://images.unsplash.com/...">
            </div>
            <button type="submit" class="btn">Add to Catalog</button>
          </form>
        </div>
      </div>

      <!-- Right Main Area: Product Catalog Grid -->
      <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h3 style="color: #fff; font-size: 1.2rem;">Featured Products</h3>
          <span style="font-size: 0.85rem; color: var(--text-muted);">Database: PostgreSQL</span>
        </div>
        <div id="product-list" class="product-grid">
          <p style="color: var(--text-muted);">Loading products from database...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_IMAGE = 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&auto=format&fit=crop&q=80';

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        const result = await res.json();
        
        const container = document.getElementById('product-list');
        if (result.data && result.data.length > 0) {
          container.innerHTML = result.data.map(p => `
            <div class="product-card">
              <div class="img-container">
                <img src="${p.image_url || DEFAULT_IMAGE}" alt="${p.name}" class="product-img" onerror="this.src='${DEFAULT_IMAGE}'">
              </div>
              <div class="product-body">
                <div class="category-tag">${p.category}</div>
                <div class="product-title">${p.name}</div>
                <div class="product-footer">
                  <div class="price-tag">$${parseFloat(p.price).toFixed(2)}</div>
                  <button class="btn-delete" onclick="handleDeleteProduct(${p.id})">Delete</button>
                </div>
              </div>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<p style="color: var(--text-muted);">No products found in store.</p>';
        }
      } catch (err) {
        document.getElementById('product-list').innerHTML = '<p style="color: var(--danger);">Failed to load products from API.</p>';
      }
    }

    async function handleCreateProduct(e) {
      e.preventDefault();
      const name = document.getElementById('p-name').value;
      const price = parseFloat(document.getElementById('p-price').value);
      const category = document.getElementById('p-category').value;
      const image_url = document.getElementById('p-image').value;

      try {
        const res = await fetch('/api/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, price, category, image_url })
        });
        if (res.ok) {
          document.getElementById('add-product-form').reset();
          loadProducts();
        }
      } catch (err) {
        alert('Failed to add product');
      }
    }

    async function handleDeleteProduct(id) {
      if (!confirm('Remove this product from store catalog?')) return;
      try {
        const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
        if (res.ok) {
          loadProducts();
        }
      } catch (err) {
        alert('Failed to delete product');
      }
    }

    loadProducts();
  </script>
</body>
</html>
