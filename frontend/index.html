<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise E-Commerce Platform</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #4ade80;
      --danger: #f87171;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem; min-height: 100vh; }
    .container { max-width: 1100px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
    h1 { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
    .badge { background: rgba(56, 189, 248, 0.1); color: var(--accent); padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.85rem; border: 1px solid rgba(56, 189, 248, 0.2); }

    .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 1.5rem; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

    .card { background: var(--card-bg); border-radius: 12px; padding: 1.5rem; border: 1px solid var(--border); margin-bottom: 1.5rem; }
    .card h2 { font-size: 1.2rem; margin-bottom: 1rem; color: #e2e8f0; }

    .status-item { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid var(--border); }
    .status-item:last-child { border-bottom: none; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; background: #ef4444; }
    .dot.online { background: var(--success); }

    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
    .product-card { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; text-align: left; position: relative; }
    .product-card h3 { font-size: 1rem; margin-bottom: 0.5rem; color: #fff; }
    .product-card .price { font-size: 1.25rem; font-weight: bold; color: var(--accent); margin-bottom: 0.5rem; }
    .product-card .cat { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

    .source-tag { display: inline-block; font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 4px; background: #334155; margin-bottom: 1rem; }
    
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: var(--text-muted); }
    .form-control { width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid var(--border); background: #0f172a; color: #fff; }
    
    .btn { background: var(--accent); color: #0f172a; border: none; padding: 0.5rem 1rem; font-weight: 600; border-radius: 6px; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-danger { background: var(--danger); color: #fff; padding: 0.25rem 0.5rem; font-size: 0.75rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🛒 Enterprise E-Commerce Platform</h1>
      <span class="badge">Docker Multi-Tier CRUD App</span>
    </header>

    <div class="grid">
      <!-- Left Column: Health & Add Product Form -->
      <div>
        <div class="card">
          <h2>Infrastructure Health</h2>
          <div class="status-item">
            <span>Nginx Reverse Proxy</span>
            <span><span class="dot online"></span>Active</span>
          </div>
          <div class="status-item">
            <span>Backend API</span>
            <span id="backend-status"><span class="dot"></span>Checking...</span>
          </div>
          <div class="status-item">
            <span>PostgreSQL DB</span>
            <span id="db-status"><span class="dot"></span>Checking...</span>
          </div>
          <button class="btn" style="margin-top: 1rem; width: 100%;" onclick="refreshData()">Refresh Status</button>
        </div>

        <!-- Create Product Form (CREATE CRUD Operation) -->
        <div class="card">
          <h2>➕ Add New Product</h2>
          <form id="add-product-form" onsubmit="handleCreateProduct(event)">
            <div class="form-group">
              <label>Product Name</label>
              <input type="text" id="p-name" class="form-control" placeholder="e.g. AWS Cloud Mug" required>
            </div>
            <div class="form-group">
              <label>Price ($)</label>
              <input type="number" step="0.01" id="p-price" class="form-control" placeholder="29.99" required>
            </div>
            <div class="form-group">
              <label>Category</label>
              <input type="text" id="p-category" class="form-control" placeholder="Electronics" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Create Product</button>
          </form>
        </div>
      </div>

      <!-- Right Column: Products Catalog (READ & DELETE CRUD Operations) -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2>Product Catalog</h2>
          <span id="data-source" class="source-tag">Source: Fetching...</span>
        </div>
        <div id="product-list" class="product-grid">
          <p style="color: var(--text-muted);">Loading products from backend API...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function checkHealth() {
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        
        document.getElementById('backend-status').innerHTML = '<span class="dot online"></span>' + data.status;
        document.getElementById('db-status').innerHTML = '<span class="dot ' + (data.services.database === 'healthy' ? 'online' : '') + '"></span>' + data.services.database;
      } catch (err) {
        document.getElementById('backend-status').innerHTML = '<span class="dot"></span>Offline';
        document.getElementById('db-status').innerHTML = '<span class="dot"></span>Offline';
      }
    }

    // READ Operation
    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        const result = await res.json();
        
        document.getElementById('data-source').innerText = 'Data Source: POSTGRESQL DB';
        
        const container = document.getElementById('product-list');
        if (result.data && result.data.length > 0) {
          container.innerHTML = result.data.map(p => `
            <div class="product-card">
              <div class="cat">${p.category}</div>
              <h3>${p.name}</h3>
              <div class="price">$${parseFloat(p.price).toFixed(2)}</div>
              <button class="btn btn-danger" onclick="handleDeleteProduct(${p.id})">Delete</button>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<p style="color: var(--text-muted);">No products found.</p>';
        }
      } catch (err) {
        document.getElementById('product-list').innerHTML = '<p style="color: #ef4444;">Failed to load products.</p>';
      }
    }

    // CREATE Operation
    async function handleCreateProduct(e) {
      e.preventDefault();
      const name = document.getElementById('p-name').value;
      const price = parseFloat(document.getElementById('p-price').value);
      const category = document.getElementById('p-category').value;

      try {
        const res = await fetch('/api/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, price, category })
        });
        if (res.ok) {
          document.getElementById('add-product-form').reset();
          loadProducts();
        }
      } catch (err) {
        alert('Failed to create product');
      }
    }

    // DELETE Operation
    async function handleDeleteProduct(id) {
      if (!confirm('Are you sure you want to delete this product?')) return;
      try {
        const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
        if (res.ok) {
          loadProducts();
        }
      } catch (err) {
        alert('Failed to delete product');
      }
    }

    function refreshData() {
      checkHealth();
      loadProducts();
    }

    refreshData();
    setInterval(checkHealth, 10000);
  </script>
</body>
</html>
