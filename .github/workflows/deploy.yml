name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Security Audit & Secret Leak Detection
  # ----------------------------------------------------------------------------
  security-audit:
    name: Security Gate (TruffleHog Secret Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Repository for Hardcoded Secrets
        uses: trufflesecurity/trufflehog-action@main
        with:
          extra_args: --only-verified

  # ----------------------------------------------------------------------------
  # Stage 2: CI - Multi-Stage Container Build & Push to Registry
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push OCI Images to GHCR
    needs: security-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Multi-Stage Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Stage 3: CD - Zero-Downtime Deployment to Production EC2
  # ----------------------------------------------------------------------------
  deploy-to-ec2:
    name: Deploy to Production EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting Production Deployment..."

            if [ -d "docker-multi-tier-ecommerce" ]; then
              cd docker-multi-tier-ecommerce
            elif [ -d "Docker-E-commerce" ]; then
              cd Docker-E-commerce
            elif [ -d "app" ]; then
              cd app
            else
              git clone https://github.com/MarzanulHoque/docker-multi-tier-ecommerce.git app
              cd app
            fi
            git pull origin main

            chmod +x deploy-ec2.sh
            ./deploy-ec2.sh

            echo "✅ Production Deployment Complete!"
