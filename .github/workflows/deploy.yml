name: Direct AWS EC2 Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy & Build directly on AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy & Build on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting Direct AWS EC2 Deployment & Build..."

            # 1. Navigate to or clone project directory
            if [ -d "docker-multi-tier-ecommerce" ]; then
              cd docker-multi-tier-ecommerce
            elif [ -d "Docker-E-commerce" ]; then
              cd Docker-E-commerce
            elif [ -d "app" ]; then
              cd app
            else
              git clone https://github.com/MarzanulHoque/docker-multi-tier-ecommerce.git app
              cd app
            fi

            # 2. Reset local changes on server & pull latest code from GitHub main branch
            git checkout -- .
            git pull origin main

            # 3. Build & start containers directly on EC2
            chmod +x deploy-ec2.sh
            ./deploy-ec2.sh

            echo "✅ Direct AWS EC2 Deployment Complete!"
